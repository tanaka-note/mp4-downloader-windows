name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install frozen tools
        shell: pwsh
        run: ./tools/Install-Tools.ps1
      - name: Locked restore
        run: dotnet restore MP4Downloader.slnx -p:Platform=x64 --locked-mode
      - name: Build
        run: dotnet build MP4Downloader.slnx -c Release -p:Platform=x64 --no-restore
      - name: Tests
        run: dotnet test MP4Downloader.slnx -c Release -p:Platform=x64 --no-build --logger trx
      - name: Security-sensitive regression tests
        run: dotnet test tests/Mp4Downloader.IntegrationTests -c Release --no-build --filter FullyQualifiedName~ReleaseSafetyTests
      - name: Self-contained publish
        shell: pwsh
        run: ./tools/Publish.ps1
      - name: Corresponding sources
        shell: pwsh
        run: ./tools/Package-Sources.ps1
      - name: License regression tests
        shell: pwsh
        run: ./tools/Test-LicenseGate.Tests.ps1
      - name: ZIP package validation
        shell: pwsh
        run: ./tools/Package.ps1 -ForRelease
      - name: Complete release assets gate
        shell: pwsh
        run: ./tools/Release-Assets.ps1
      - name: Published ZIP startup and safe-save smoke
        shell: pwsh
        run: ./tools/Smoke-Test.ps1 -PublishDirectory ./artifacts/package-smoke -ReleaseSmoke
      - name: Restore validation harness
        run: dotnet restore tools/Mp4Downloader.Validation --locked-mode
      - name: Distinct virtual-volume save
        shell: pwsh
        run: ./tools/Test-VirtualVolume.ps1
